name: docker-compose-workflow

on:
  push:
    branches:
      - main
    paths:
      - "backend/*"
      - "frontend/*"
      - "database/*"
      - "*"

jobs:
  debug:
    runs-on: rocky

    steps:
      - name: Print full event
        run: echo '${{ toJson(github.event) }}'

      - name: Print head_commit
        run: echo '${{ toJson(github.event.head_commit) }}'

      - name: Print modified files
        run: echo '${{ toJson(github.event.head_commit.modified) }}'

      - name: Print added files
        run: echo '${{ toJson(github.event.head_commit.added) }}'

      - name: Print removed files
        run: echo '${{ toJson(github.event.head_commit.removed) }}'

      - name: Test database condition
        run: |
          echo "database modified = ${{ contains(toJson(github.event.head_commit.modified), 'database/') }}"
          echo "database added    = ${{ contains(toJson(github.event.head_commit.added), 'database/') }}"

      - name: Test backend condition
        run: |
          echo "backend modified = ${{ contains(toJson(github.event.head_commit.modified), 'backend/') }}"
          echo "backend added    = ${{ contains(toJson(github.event.head_commit.added), 'backend/') }}"

      - name: Test frontend condition
        run: |
          echo "frontend modified = ${{ contains(toJson(github.event.head_commit.modified), 'frontend/') }}"
          echo "frontend added    = ${{ contains(toJson(github.event.head_commit.added), 'frontend/') }}"

  updata-database:
    runs-on: rocky
    defaults:
      run:
        working-directory: /home/badawy/bank-system-containerized-v2/devops-bank-system

    steps:
      - name: Build new database
        run: docker compose build database

      - name: Run new database
        run: docker compose up -d --no-deps database

  updata-backend:
    runs-on: rocky
    defaults:
      run:
        working-directory: /home/badawy/bank-system-containerized-v2/devops-bank-system

    steps:
      - name: Build new backend
        run: docker compose build backend

      - name: Run new backend
        run: docker compose up -d --no-deps backend

  updata-frontend:
    runs-on: rocky
    defaults:
      run:
        working-directory: /home/badawy/bank-system-containerized-v2/devops-bank-system

    steps:
      - name: Build new frontend
        run: docker compose build frontend

      - name: Run new frontend
        run: docker compose up -d --no-deps frontend
