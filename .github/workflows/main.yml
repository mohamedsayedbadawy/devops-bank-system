name: docker-compose-workflow
on: 
  push:
    paths:
      - "/*"
      - "backend/*"
      - "front/*"
      - "database/*"
jobs:
  compose-down:
    runs-on: rocky
    steps:
      - name: move to the docker compose dir
        run: cd /home/badawy/bank-system-containerized-v2
      - name: down current docker compose background
        run: docker compose down
      - name: docker compose up new one
        run: docekr compose up -d 
