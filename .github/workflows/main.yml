name: docker-compose-workflow
on: 
  push:
    paths:
      - "/*"
      - "backend/*"
      - "front/*"
      - "database/*"
jobs:
  compose-down:
    runs-on: rocky
    defaults:
      run:
        working-directory: /home/badawy/bank-system-containerized-v2/devops-bank-system
    steps:
      - name: down current docker compose background
        run: docker compose down
      - name: docker compose up new one
        run: docekr compose up -d 
